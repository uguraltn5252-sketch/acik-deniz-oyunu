name: FOULWAKE Governance

on:
  pull_request:
    branches:
      - main
      - v2.7-design
  push:
    branches:
      - main
      - v2.7-design
      - 'work/**'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Protect locked v2.6 tree
        shell: bash
        run: |
          set -euo pipefail
          expected='efb41c46f06174c42dcdab2859b7c0ba517f86f0'
          actual="$(git rev-parse HEAD:releases/v2.6)"
          if [ "$actual" != "$expected" ]; then
            echo "BLOCKER: releases/v2.6 tree drift: $actual"
            exit 1
          fi

      - name: Resolve workstream
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            branch="$HEAD_REF"
            head_sha="$PR_HEAD_SHA"
          else
            branch="$REF_NAME"
            head_sha="$PUSH_SHA"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          case "$branch" in
            work/*)
              echo "specialist=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "specialist=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Load authoritative specialist policy
        if: steps.route.outputs.specialist == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin v2.7-design
          git show origin/v2.7-design:governance/validate_workstream_scope.py > /tmp/validate_workstream_scope.py
          git show origin/v2.7-design:governance/WORKSTREAM_SCOPE_BASELINES.json > /tmp/WORKSTREAM_SCOPE_BASELINES.json

      - name: Validate specialist cumulative scope
        if: steps.route.outputs.specialist == 'true'
        env:
          WORKSTREAM_BRANCH: ${{ steps.route.outputs.branch }}
          HEAD_SHA: ${{ steps.route.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/validate_workstream_scope.py \
            --config /tmp/WORKSTREAM_SCOPE_BASELINES.json \
            --branch "$WORKSTREAM_BRANCH" \
            --head "$HEAD_SHA"

      - name: Validate integrated governance
        if: steps.route.outputs.specialist != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile governance/validate_governance.py governance/validate_workstream_scope.py
          python governance/validate_governance.py
